<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Folder of components — snapDiff demo</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Mansalva&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./shared.css" />

<style>
  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 14px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  /* ── Status panel ── */
  #status {
    padding: 18px 20px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  #status .progress {
    height: 6px;
    background: var(--accent-soft);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    margin-top: 12px;
    overflow: hidden;
  }
  #status .progress .bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .15s ease;
  }
  #status .components-list {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
  }

  iframe.test-frame {
    position: absolute; left: -99999px; top: 0;
    border: 0; width: 1280px; height: 1024px;
  }
</style>
</head>
<body>

<section class="hero-block compact">
  <img src="./assets/mrsnapdom-run.png" alt="Mr SnapDOM running" class="hero-mascot" width="120" height="100" />
  <h1><span class="accent">03</span> <span class="accent-ink">Folder of components</span></h1>
  <p class="tagline">
    Reads <code>./components/</code>, loads each HTML in a hidden iframe, captures via
    snapdom, diffs against IndexedDB. <em>Pure browser.</em>
  </p>
</section>

<div class="section-label">Controls</div>

<main class="page-main">
  <div class="toolbar">
    <button id="run" class="btn btn-primary">
      <i class="fas fa-play"></i> Run tests
    </button>
    <label class="field">
      <input type="checkbox" id="mutate" />
      inject mutation (<code style="background:transparent;color:var(--accent);padding:0">filter: hue-rotate</code>) on next run
    </label>
    <button id="clear" class="btn btn-danger">
      <i class="fas fa-trash"></i> Clear baselines
    </button>
  </div>

  <div class="section-label" style="padding: 0; margin: 22px 0 14px;">Status</div>

  <div id="status">Loading manifest…</div>
</main>

<nav class="page-nav">
  <a href="./">Demos</a>
  <a href="./auto.html">Auto</a>
  <a href="./in-page.html">In tests</a>
  <a href="./components-test.html" class="current">Components</a>
  <a href="https://github.com/zumerlab/snapdiff" target="_blank" rel="noopener">GitHub</a>
  <a href="https://www.npmjs.com/package/@zumer/snapdiff" target="_blank" rel="noopener">npm</a>
  <a href="https://snapdom.dev/" target="_blank" rel="noopener">snapDOM ↗</a>
</nav>

<script type="module">
import { snapdom } from 'https://esm.sh/@zumer/snapdom'
import { createRunner, Reporter } from '../src/index.js'
import { captureFromIframe } from '../vitest/iframe-capture.js'

const FOLDER = './components'
const SNAPDOM_URL = 'https://esm.sh/@zumer/snapdom'

async function listComponents() {
  try {
    const res = await fetch(FOLDER + '/')
    if (res.ok && /text\/html/i.test(res.headers.get('content-type') || '')) {
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html')
      const hrefs = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href'))
        .filter(h => /\.html?$/i.test(h) && !/^index\.html?$/i.test(h.split('/').pop()))
      if (hrefs.length) return hrefs.sort()
    }
  } catch { /* fall through */ }

  const res = await fetch(`${FOLDER}/manifest.json`)
  if (!res.ok) throw new Error('No directory listing or manifest.json')
  const data = await res.json()
  return data.components
}

function baseName(url) {
  const m = String(url).match(/([^/\\]+?)(?:\.html?)?$/i)
  return m ? m[1] : String(url)
}

const status = document.getElementById('status')
function renderStatus(msg, results) {
  status.innerHTML = ''
  const top = document.createElement('div')
  top.textContent = msg
  status.appendChild(top)
  if (Array.isArray(results) && results.length) {
    const list = document.createElement('div')
    list.className = 'components-list'
    for (const r of results) {
      const pill = document.createElement('span')
      pill.className = `sticker ${r.status}`
      pill.textContent = `${r.name} · ${r.status}${r.ratio != null ? ` (${(r.ratio * 100).toFixed(1)}%)` : ''}`
      list.appendChild(pill)
    }
    status.appendChild(list)
  }
}
function renderProgress(done, total, label) {
  status.innerHTML = ''
  const top = document.createElement('div')
  top.textContent = `${label} (${done}/${total})`
  const bar = document.createElement('div')
  bar.className = 'progress'
  const fill = document.createElement('div')
  fill.className = 'bar'
  fill.style.width = `${total ? (done / total) * 100 : 0}%`
  bar.appendChild(fill)
  status.append(top, bar)
}

const components = await listComponents()
renderStatus(`Found ${components.length} component(s) in ${FOLDER}/`)

const iframe = document.createElement('iframe')
iframe.className = 'test-frame'
document.body.appendChild(iframe)

const runner = createRunner({
  snapdom,
  namespace: 'components-demo',
  threshold: 0.1,
  failureRatio: 0.005,
})

const mutateCheckbox = document.getElementById('mutate')
function mutationSetup(_win, doc) {
  const style = doc.createElement('style')
  style.textContent = '#target { filter: hue-rotate(90deg); }'
  doc.head.appendChild(style)
}

for (const url of components) {
  const name = baseName(url)
  const fullUrl = url.startsWith('/') || /^https?:/.test(url)
    ? url
    : `${FOLDER}/${url.replace(/^\.\//, '')}`
  runner.test(name, async () => {
    const iframeCanvas = await captureFromIframe(iframe, fullUrl, {
      target: ['#target', 'body'],
      wait: 80,
      snapdomUrl: SNAPDOM_URL,
      snapdomOptions: { dpr: 1, scale: 1, embedFonts: true },
      setup: mutateCheckbox.checked ? mutationSetup : undefined,
    })
    const c = document.createElement('canvas')
    c.width = iframeCanvas.width
    c.height = iframeCanvas.height
    c.getContext('2d').drawImage(iframeCanvas, 0, 0)
    return c
  })
}

const reporter = new Reporter(runner, { onClose: () => reporter.unmount() })

async function runAll() {
  renderProgress(0, components.length, 'Running tests')
  const results = await runner.run({
    onProgress: ({ index, total, result }) => {
      renderProgress(index + 1, total, `Tested ${result.name}`)
    },
  })
  reporter.mount()
  reporter.setResults(results)
  renderStatus(`Done — ${runner.summary(results).pass}/${results.length} passing.`, results)
}

document.getElementById('run').onclick = runAll
document.getElementById('clear').onclick = async () => {
  if (!confirm('Delete all baselines for namespace "components-demo"?')) return
  await runner.store.clear()
  renderStatus('Baselines cleared. Click Run tests to record fresh ones.')
}

runAll()
</script>
</body>
</html>
