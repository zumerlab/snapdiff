<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  body { margin: 0; padding: 40px; background: #f4f5f7; font: 14px ui-sans-serif, system-ui, sans-serif; }
  #target { display: inline-flex; gap: 8px; }
  .btn-primary {
    background: #2f6df6; color: white; border: 0;
    padding: 10px 18px; border-radius: 8px; font: 600 14px ui-sans-serif, system-ui, sans-serif;
    box-shadow: 0 2px 6px rgba(47,109,246,.3);
  }
  .btn-secondary {
    background: white; color: #2f6df6; border: 1px solid #2f6df6;
    padding: 10px 18px; border-radius: 8px; font: 600 14px ui-sans-serif, system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="target">
  <button class="btn-primary">Save changes</button>
  <button class="btn-secondary">Cancel</button>
</div>
</body>
</html>
