<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<style>
  body { margin: 0; padding: 40px; background: #f4f5f7; font: 14px ui-sans-serif, system-ui, sans-serif; color: #1a1d24; }
  #target {
    width: 320px; background: white; padding: 20px;
    border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  #target h3 { margin: 0 0 6px; font-size: 16px; }
  #target p { margin: 0; opacity: .65; font-size: 13px; line-height: 1.5; }
  #target .meta { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e6e8ee; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="target">
  <h3>Welcome aboard</h3>
  <p>Your workspace is ready. Invite teammates or jump straight into your first project.</p>
  <div class="meta">Updated 2 hours ago · 3 members</div>
</div>
</body>
</html>
