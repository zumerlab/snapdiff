<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<style>
  body { margin: 0; padding: 40px; background: #f4f5f7; font: 14px ui-sans-serif, system-ui, sans-serif; }
  #target { width: 320px; }
  #target .row {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; font-size: 13px; color: #1a1d24;
  }
  #target .row strong { font-variant-numeric: tabular-nums; }
  #target .track { height: 8px; background: #e6e8ee; border-radius: 999px; overflow: hidden; }
  #target .fill {
    width: 65%; height: 100%;
    background: linear-gradient(90deg, #2f6df6, #6f5cff);
    border-radius: 999px;
  }
</style>
</head>
<body>
<div id="target">
  <div class="row"><span>Onboarding</span><strong>65%</strong></div>
  <div class="track"><div class="fill"></div></div>
</div>
</body>
</html>
