<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle</title>
<style>
  body { margin: 0; padding: 40px; background: #f4f5f7; font: 14px ui-sans-serif, system-ui, sans-serif; }
  #target {
    display: inline-flex; align-items: center; gap: 12px;
    background: white; padding: 10px 16px; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #target span { color: #1a1d24; font-weight: 500; }
  #target .switch {
    position: relative; width: 40px; height: 22px;
    background: #2f6df6; border-radius: 999px;
  }
  #target .switch::after {
    content: ''; position: absolute;
    width: 16px; height: 16px;
    background: white; border-radius: 50%;
    top: 3px; right: 3px;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
</style>
</head>
<body>
<div id="target">
  <span>Email notifications</span>
  <div class="switch"></div>
</div>
</body>
</html>
