<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component folder — snapDiff</title>

<link rel="stylesheet" href="./shared.css?v=2" />

<style>
  /* ── Status panel ── */
  #status {
    padding: 16px 0;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  #status .progress {
    height: 4px;
    background: var(--accent-soft);
    margin-top: 12px;
    overflow: hidden;
  }
  #status .progress .bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .15s ease;
  }
  #status .components-list {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
  }

  iframe.test-frame {
    position: absolute; left: -99999px; top: 0;
    border: 0; width: 1280px; height: 1024px;
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="./">snapDiff</a>
  <nav class="site-links" aria-label="Project">
    <a href="https://github.com/zumerlab/snapdiff">GitHub</a>
    <a href="https://www.npmjs.com/package/@zumer/snapdiff">npm</a>
  </nav>
</header>

<nav class="page-nav" aria-label="Examples">
  <a href="./">Overview</a>
  <a href="./auto.html">Script tag</a>
  <a href="./in-page.html">Test runner</a>
  <a href="./components-test.html" class="current" aria-current="page">Components</a>
</nav>

<section class="hero-block compact">
  <h1>Component folder</h1>
  <p class="tagline">Load each HTML file in <code>./components/</code>, capture it in an iframe, and compare it with a baseline saved in this browser.</p>
</section>

<main class="page-main">
  <div class="toolbar">
    <button id="run" class="btn btn-primary" disabled>
      Run tests
    </button>
    <label class="field">
      <input type="checkbox" id="mutate" />
      Change colors on next run
    </label>
    <button id="clear" class="btn" disabled>
      Clear baselines
    </button>
  </div>

  <h2 class="section-label">Status</h2>

  <div id="status" role="status">Loading components…</div>
</main>

<footer class="page-footer"><span>Part of <a href="https://zumerlab.com/">Zumerlab</a>.</span></footer>

<script type="module">
const FOLDER = './components'
const SNAPDOM_URL = 'https://esm.sh/@zumer/snapdom@2'

async function listComponents() {
  try {
    const res = await fetch(FOLDER + '/')
    if (res.ok && /text\/html/i.test(res.headers.get('content-type') || '')) {
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html')
      const hrefs = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href'))
        .filter(h => /\.html?$/i.test(h) && !/^index\.html?$/i.test(h.split('/').pop()))
      if (hrefs.length) return hrefs.sort()
    }
  } catch { /* fall through */ }

  const res = await fetch(`${FOLDER}/manifest.json`)
  if (!res.ok) throw new Error('No directory listing or manifest.json')
  const data = await res.json()
  if (!Array.isArray(data.components) || !data.components.length) {
    throw new Error('The manifest contains no components')
  }
  return data.components
}

function baseName(url) {
  const m = String(url).match(/([^/\\]+?)(?:\.html?)?$/i)
  return m ? m[1] : String(url)
}

const status = document.getElementById('status')
function renderStatus(msg, results) {
  status.innerHTML = ''
  const top = document.createElement('div')
  top.textContent = msg
  status.appendChild(top)
  if (Array.isArray(results) && results.length) {
    const list = document.createElement('div')
    list.className = 'components-list'
    for (const r of results) {
      const pill = document.createElement('span')
      pill.className = `sticker ${r.status}`
      pill.textContent = `${r.name} · ${r.status}${r.ratio != null ? ` (${(r.ratio * 100).toFixed(1)}%)` : ''}`
      list.appendChild(pill)
    }
    status.appendChild(list)
  }
}
function renderProgress(done, total, label) {
  status.innerHTML = ''
  const top = document.createElement('div')
  top.textContent = `${label} (${done}/${total})`
  const bar = document.createElement('div')
  bar.className = 'progress'
  const fill = document.createElement('div')
  fill.className = 'bar'
  fill.style.width = `${total ? (done / total) * 100 : 0}%`
  bar.appendChild(fill)
  status.append(top, bar)
}

const run = document.getElementById('run')
const clear = document.getElementById('clear')
const mutateCheckbox = document.getElementById('mutate')
function setBusy(busy) {
  for (const control of [run, clear, mutateCheckbox]) control.disabled = busy
}

try {
  const [{ snapdom }, { createRunner, Reporter }, { captureFromIframe }, components] = await Promise.all([
    import(SNAPDOM_URL),
    import('./lib/snapdiff.mjs'),
    import('./lib/iframe-capture.js'),
    listComponents(),
  ])
  renderStatus(`${components.length} components ready. Run tests to capture them.`)

  const iframe = document.createElement('iframe')
  iframe.className = 'test-frame'
  iframe.tabIndex = -1
  iframe.setAttribute('aria-hidden', 'true')
  document.body.appendChild(iframe)

  const runner = createRunner({
    snapdom,
    namespace: 'components-demo',
    threshold: 0.1,
    failureRatio: 0.005,
  })

  function mutationSetup(_win, doc) {
    const style = doc.createElement('style')
    style.textContent = '#target { filter: hue-rotate(90deg); }'
    doc.head.appendChild(style)
  }

  for (const url of components) {
    const name = baseName(url)
    const componentPath = url.startsWith('/') || /^https?:/.test(url)
      ? url
      : `${FOLDER}/${url.replace(/^\.\//, '')}`
    const fullUrl = new URL(componentPath, location.href).href
    runner.test(name, async () => {
      const iframeCanvas = await captureFromIframe(iframe, fullUrl, {
        target: ['#target', 'body'],
        wait: 80,
        snapdomUrl: SNAPDOM_URL,
        snapdomOptions: { dpr: 1, scale: 1, embedFonts: true, invalidate: true },
        setup: mutateCheckbox.checked ? mutationSetup : undefined,
      })
      const c = document.createElement('canvas')
      c.width = iframeCanvas.width
      c.height = iframeCanvas.height
      c.getContext('2d').drawImage(iframeCanvas, 0, 0)
      return c
    })
  }

  const reporter = new Reporter(runner, { onClose: () => reporter.unmount() })

  async function runAll() {
    setBusy(true)
    run.textContent = 'Running…'
    renderProgress(0, components.length, 'Running tests')
    try {
      const results = await runner.run({
        onProgress: ({ index, total, result }) => {
          renderProgress(index + 1, total, `Tested ${result.name}`)
        },
      })
      reporter.mount()
      reporter.setResults(results)
      const summary = runner.summary(results)
      renderStatus(`${summary.pass} passed, ${summary.fail} failed, ${summary.new} new, ${summary.error} errors.`, results)
    } catch (error) {
      renderStatus(`Could not run tests: ${error.message}`)
    } finally {
      setBusy(false)
      run.textContent = 'Run tests'
    }
  }

  run.onclick = runAll
  clear.onclick = async () => {
    if (!confirm('Delete all baselines for namespace "components-demo"?')) return
    setBusy(true)
    try {
      await runner.store.clear()
      renderStatus('Baselines cleared. Run tests, then save the new baselines in the report.')
    } catch (error) {
      renderStatus(`Could not clear baselines: ${error.message}`)
    } finally {
      setBusy(false)
    }
  }
  setBusy(false)
} catch (error) {
  renderStatus(`Could not load the demo: ${error.message}. Reload to try again.`)
}
</script>
</body>
</html>
