<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<style>
  body { margin: 0; padding: 40px; background: #f4f5f7; font: 14px ui-sans-serif, system-ui, sans-serif; }
  #target {
    display: inline-flex; padding: 4px;
    background: white; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #target button {
    background: transparent; border: 0;
    padding: 8px 16px; border-radius: 7px; cursor: pointer;
    font: 600 13px ui-sans-serif, system-ui, sans-serif;
    color: #6b7280;
  }
  #target button.active {
    background: #2f6df6; color: white;
    box-shadow: 0 2px 6px rgba(47,109,246,.3);
  }
</style>
</head>
<body>
<div id="target">
  <button>Overview</button>
  <button class="active">Settings</button>
  <button>Members</button>
  <button>Billing</button>
</div>
</body>
</html>
